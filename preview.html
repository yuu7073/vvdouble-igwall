<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG 內容牆 · 預覽</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#2A2F3A;font-family:"Noto Sans TC",system-ui,sans-serif;color:#fff;height:100vh;display:flex;flex-direction:column}
.bar{height:48px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#1F2430;flex:none}
.bar b{font-size:14px;letter-spacing:.5px}
.seg{display:inline-flex;border:1px solid #4A5160;border-radius:6px;overflow:hidden}
.seg button{padding:0 14px;height:30px;border:0;background:transparent;color:#B8BEC9;font:13px "Noto Sans TC",sans-serif;border-right:1px solid #4A5160;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.s{background:#fff;color:#1F2430}
.bar .r{margin-left:auto;display:flex;gap:16px;font-size:12px;color:#B8BEC9}
.bar a{color:#fff}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:20px;overflow:auto}
iframe{border:0;background:#fff;height:100%;width:100%;max-width:1440px;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
iframe.m{width:390px;height:844px}
</style>
</head>
<body>
<div class="bar">
  <b>IG 內容牆 · 預覽</b>
  <span class="seg" id="page"><button data-v="home" class="s">首頁</button><button data-v="product">商品頁</button></span>
  <span class="seg" id="dev"><button data-v="d" class="s">桌機</button><button data-v="m">手機</button></span>
  <span class="r"><span id="snapAt"></span><a href="./">回後台</a></span>
</div>
<div class="stage"><iframe id="f" src="preview/home.html"></iframe></div>
<script>
var S = { page:'home', dev:'d' };
function paint(){
  document.querySelectorAll('#page button').forEach(function(b){ b.classList.toggle('s', b.dataset.v === S.page); });
  document.querySelectorAll('#dev button').forEach(function(b){ b.classList.toggle('s', b.dataset.v === S.dev); });
  var f = document.getElementById('f'); f.className = S.dev === 'm' ? 'm' : ''; f.src = 'preview/' + S.page + '.html?' + Date.now();
}
document.querySelectorAll('#page button').forEach(function(b){ b.addEventListener('click', function(){ S.page = b.dataset.v; paint(); }); });
document.querySelectorAll('#dev button').forEach(function(b){ b.addEventListener('click', function(){ S.dev = b.dataset.v; paint(); }); });
fetch('preview/home.html', { method:'HEAD' }).then(function(r){ var d = r.headers.get('last-modified'); if (d) document.getElementById('snapAt').textContent = '快照 ' + new Date(d).toLocaleString('zh-TW', { hour12:false }); });
</script>
</body>
</html>
